name: Publish AI Talk
on:
  push:
    branches: [main]
    paths: ['.release/ai-talk/request.json']
permissions:
  contents: write
concurrency:
  group: yellow-house-ai-talk-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'jgohdapt/noranjip-updates' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify pinned AI Talk publisher
        shell: bash
        run: |
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/jgohdapt/noranjip-updates/$GITHUB_SHA/.release/ai-talk/publish.mjs" -o /tmp/ai-talk-publish.mjs
          echo '3adad4dabe94ec49478a4f82ceb63eeb9847ce7479ac5f4a9ff5273d799b66f0  /tmp/ai-talk-publish.mjs' | sha256sum --check --strict
      - name: Publish installer and update channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: node /tmp/ai-talk-publish.mjs --publish
