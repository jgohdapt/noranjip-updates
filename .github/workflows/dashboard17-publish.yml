name: Publish verified dashboard .17
on:
  push:
    branches: [main]
    paths: [.release/dashboard17/phase.json]
permissions:
  contents: write
concurrency:
  group: noranjip-dashboard-v2-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'jgohdapt/noranjip-updates' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify pinned publisher and run selected phase
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, os, re, urllib.request
          repo = os.environ.get('GITHUB_REPOSITORY', '')
          commit = os.environ.get('GITHUB_SHA', '')
          if repo != 'jgohdapt/noranjip-updates' or not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise SystemExit('WORKFLOW_CONTEXT_REFUSED')
          url = f'https://raw.githubusercontent.com/{repo}/{commit}/.release/dashboard17/publish_dashboard17.py'
          with urllib.request.urlopen(url, timeout=30) as response:
              source = response.read(131073)
          if len(source) > 131072 or hashlib.sha256(source).hexdigest().upper() != 'AFD5FB033C87F3126384CCDF54DFAAD98E9D6E5C2C1599F6280EA5AC74E6EA6A':
              raise SystemExit('PUBLISHER_HASH_REFUSED')
          exec(compile(source, 'publish_dashboard17.py', 'exec'), {'__name__': '__main__'})
          PY
