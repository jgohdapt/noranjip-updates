name: Check common remote publisher
on:
  push:
    branches: [main]
    paths:
      - .release/common/tools/**
      - .release/common/tests/**
      - .github/workflows/common-remote-checks.yml
  pull_request:
    paths: [.release/common/**]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .release/common/tests/*.test.mjs
