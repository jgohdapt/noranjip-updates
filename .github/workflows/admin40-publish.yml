name: Publish verified administrator .40
on:
  push:
    branches: [main]
    paths: [.release/admin40/phase.json]
permissions:
  contents: write
concurrency:
  group: noranjip-admin-v2-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'jgohdapt/noranjip-updates' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify pinned publisher and run selected phase
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, os, re, urllib.request
          repo = os.environ.get('GITHUB_REPOSITORY', '')
          commit = os.environ.get('GITHUB_SHA', '')
          if repo != 'jgohdapt/noranjip-updates' or not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise SystemExit('WORKFLOW_CONTEXT_REFUSED')
          url = f'https://raw.githubusercontent.com/{repo}/{commit}/.release/admin40/publish_admin40.py'
          with urllib.request.urlopen(url, timeout=30) as response:
              source = response.read(131073)
          if len(source) > 131072 or hashlib.sha256(source).hexdigest().upper() != '178846164D7A2D66FCC92E5AEBA1A0AFF4783BB3EB1CD7FA126D709BFC8DC4E6':
              raise SystemExit('PUBLISHER_HASH_REFUSED')
          exec(compile(source, 'publish_admin40.py', 'exec'), {'__name__': '__main__'})
          PY
