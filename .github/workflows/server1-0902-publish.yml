name: Publish remote 0.9.0.2 to server1 only
on:
  push:
    branches: [main]
    paths: [.release/server1-0902/request.json]
permissions:
  contents: write
concurrency:
  group: noranjip-common-remote-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'jgohdapt/noranjip-updates' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synthetic and real-bundle checks
        run: node --test .release/server1-0902/publish.test.mjs
      - name: Verify and publish server1 only
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .release/server1-0902/publish.mjs
      - name: Retain publication result even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server1-0902-publication-result
          path: server1-0902-publication-result.json
          if-no-files-found: warn
          retention-days: 90
