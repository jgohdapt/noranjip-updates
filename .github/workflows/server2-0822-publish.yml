name: Publish verified Server2 remote 0.8.2.2
on:
  push:
    branches: [main]
    paths: [.release/server2-0822/phase.json]
permissions:
  contents: write
concurrency:
  group: noranjip-server2-remote-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'jgohdapt/noranjip-updates' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify pinned publisher and run selected phase
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, os, re, urllib.request
          repo = os.environ.get('GITHUB_REPOSITORY', '')
          commit = os.environ.get('GITHUB_SHA', '')
          if repo != 'jgohdapt/noranjip-updates' or not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise SystemExit('WORKFLOW_CONTEXT_REFUSED')
          url = f'https://raw.githubusercontent.com/{repo}/{commit}/.release/server2-0822/publish_server2.py'
          with urllib.request.urlopen(url, timeout=30) as response:
              source = response.read(131073)
          if len(source) > 131072 or hashlib.sha256(source).hexdigest().upper() != 'F7D4DC2DB3BD75C5C6693F0AC17D021DB61CD5A24E60261F6FF792AF7EA3A76D':
              raise SystemExit('PUBLISHER_HASH_REFUSED')
          exec(compile(source, 'publish_server2.py', 'exec'), {'__name__': '__main__'})
          PY

